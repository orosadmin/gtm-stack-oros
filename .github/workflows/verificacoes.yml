name: verificacoes

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSAO: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Modelos do GTM (JSON e referências)
        run: node scripts/gtm-validar.mjs

      - name: Sem comentários no código
        run: node scripts/verificar-comentarios.mjs

      - name: Teste do fbc
        run: node skills/gtm-tracking/references/fbc-teste.mjs

      - name: Segredos e dados pessoais na árvore
        run: node scripts/verificar-segredos.mjs

      - name: Segredos e dados pessoais no histórico
        run: node scripts/verificar-segredos.mjs --historico

      - name: Gitleaks (árvore e histórico)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
